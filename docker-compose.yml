services:
  mariadb:
    image: mariadb:11
    container_name: residencias-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_DATABASE: ${DATABASE_NAME}
    volumes:
      # Datos persistentes
      - datos_mariadb:/var/lib/mysql
      # Scripts de inicializacion (solo se ejecutan la primera vez)
      - ./init-db/01-inicializar.sh:/docker-entrypoint-initdb.d/01-inicializar.sh
      - ./.db-tables:/docker-entrypoint-initdb.d/sql/tablas.sql
      - ./.db-procedures:/docker-entrypoint-initdb.d/sql/procedimientos.sql
    # Sin mapeo de puertos: la base de datos solo es accesible desde la red
    # interna de compose. El backend la alcanza como DATABASE_HOST=mariadb.
    # Para administrarla:  docker compose exec mariadb mariadb -u root -p
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Se construye desde el codigo local de este repositorio. Antes se
    # descargaba de ghcr.io/artdryy, pero ese paquete es privado y el pull
    # falla con "denied" para quien no tenga un token del registro.
    build:
      context: .
    image: be-graduate-report-manager:local
    container_name: residencias-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: ${PORT:-3000}
      DATABASE_HOST: mariadb
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_PORT: 3306
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRATION: ${ACCESS_TOKEN_EXPIRATION:-90m}
      REFRESH_TOKEN_EXPIRATION_DAYS: ${REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Inicializacion automatica (superusuario, catalogo y semestres)
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-true}
      SUPERUSER_USER: ${SUPERUSER_USER}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      SUPERUSER_ROLE_NAME: ${SUPERUSER_ROLE_NAME:-Superusuario}
    volumes:
      - datos_uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    # El frontend vive en otro repositorio, que desplegar.sh clona como
    # directorio hermano si falta. VITE_API_URL=/api porque nginx sirve el
    # frontend y hace proxy de /api hacia el backend: todo es el mismo origen.
    build:
      context: ../FE-Graduate-Report-Manager
      args:
        VITE_API_URL: /api
    image: fe-graduate-report-manager:local
    container_name: residencias-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datos_mariadb:
  datos_uploads:
